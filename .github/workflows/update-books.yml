name: Update books

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Only one update runs at a time. A second one waits its turn instead of colliding,
# which is what made the save step fail before.
concurrency:
  group: update-books
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the shelf
        run: python3 scripts/fetch_books.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet books.json; then
            echo "No new books today."
          else
            git add books.json
            git commit -m "Refresh shelf"
            git pull --rebase origin main
            git push
          fi
