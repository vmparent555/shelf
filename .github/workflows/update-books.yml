name: Update books

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Fetch the shelf
        run: python3 scripts/fetch_books.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet books.json; then
            echo "No new books today."
          else
            git add books.json
            git commit -m "Refresh shelf"
            git push
          fi
