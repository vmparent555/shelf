<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  background: #f6f5f1;
}

body {
  font-family: Spectral, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color: #262320;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-transition: -webkit-filter 4s linear;
  transition: filter 4s linear;
}

body.dimmed {
  -webkit-filter: brightness(0.42);
  filter: brightness(0.42);
}

.stage {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

.slide {
  --s: 2.1;
  --m: calc(1 + (var(--s) - 1) * 0.4);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  padding: 6vmin 5vmin;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  opacity: 0;
  -webkit-transition: opacity 1.1s ease-in-out;
  transition: opacity 1.1s ease-in-out;
}

.slide.showing {
  opacity: 1;
}

.cover {
  display: block;
  max-height: 88vh;
  max-width: 44vw;
  width: auto;
  height: auto;
  border: 1px solid #dcd8d0;
  margin-right: 4.5vmin;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}

.cover.hidden {
  display: none;
  margin-right: 0;
}

.detail {
  max-width: 50vw;
  min-width: 0;
}

.detail.wide {
  max-width: 74vw;
  text-align: center;
}

.title {
  font-size: calc(6.8vmin * var(--s));
  font-weight: 400;
  line-height: 1.08;
  letter-spacing: -0.008em;
  margin: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}

.subtitle {
  font-size: calc(2.7vmin * var(--s));
  font-weight: 300;
  line-height: 1.35;
  color: #6d675f;
  margin: calc(1.6vmin * var(--m)) 0 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.author {
  font-size: calc(3.3vmin * var(--s));
  font-style: italic;
  font-weight: 400;
  margin: calc(2.6vmin * var(--m)) 0 0;
  color: #3d3a35;
}

.series {
  font-size: calc(2.4vmin * var(--s));
  font-style: italic;
  font-weight: 300;
  color: #8a847b;
  margin: calc(1.6vmin * var(--m)) 0 0;
}

.rating {
  margin: calc(4.4vmin * var(--m)) 0 0;
  height: calc(4.4vmin * var(--s));
  line-height: 0;
}

.rating svg {
  height: calc(4.4vmin * var(--s));
  width: calc(4.4vmin * var(--s));
  margin-right: calc(1.1vmin * var(--s));
  vertical-align: top;
}

.rating.empty {
  display: none;
}

.date {
  font-size: calc(3.1vmin * var(--s));
  font-weight: 400;
  color: #46423c;
  margin: calc(4vmin * var(--m)) 0 0;
  letter-spacing: 0.02em;
}

.pages {
  font-size: calc(2.3vmin * var(--s));
  font-weight: 300;
  color: #8a847b;
  margin: calc(2.4vmin * var(--m)) 0 0;
}

.notice {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  margin-top: -3vmin;
  text-align: center;
  font-size: 3vmin;
  font-style: italic;
  color: #8a847b;
  padding: 0 10vmin;
}

.notice.gone {
  display: none;
}

/* Overnight: a plain black screen. The page can't switch the iPad's backlight off. */
#night {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #000;
  z-index: 2147483600;
}

@media (prefers-reduced-motion: reduce) {
  .slide {
    -webkit-transition: none;
    transition: none;
  }
}
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<p class="notice" id="notice">Loading the shelf</p>
<div id="night"></div>

<script>
(function () {
  var DATA_URL = "books.json";
  var SLIDE_MS = 18000;
  var REFETCH_MS = 6 * 60 * 60 * 1000;
  var STORAGE_KEY = "shelf-progress-v1";
  var DIM_START_HOUR = 21;
  var DIM_END_HOUR = 6;

  // From 11:00 PM to 6:30 AM the screen goes black: no slides, no plane alerts.
  var NIGHT_START = 23 * 60;
  var NIGHT_END = 6 * 60 + 30;

  // Text starts at 2.1x its original size and shrinks only as far as a long title needs.
  var SCALE_MAX = 2.1;
  var SCALE_MIN = 1.1;

  var STAR_PATH = "M12 2.2l3.05 6.18 6.82 1-4.94 4.81 1.17 6.79L12 17.77 5.9 20.98l1.17-6.79L2.13 9.38l6.82-1z";

  var stage = document.getElementById("stage");
  var notice = document.getElementById("notice");

  var books = [];
  var deck = [];
  var current = 0;
  var layers = [];
  var timer = null;
  var nightOn = false;
  var nightEl = document.getElementById("night");

  function isNight() {
    // ?nightoff or ?flighttest on the address lets you test the page at night
    if (/[?&](nightoff|flighttest)/.test(window.location.search)) {
      return false;
    }
    var now = new Date();
    var minutes = now.getHours() * 60 + now.getMinutes();
    return minutes >= NIGHT_START || minutes < NIGHT_END;
  }
  window.shelfIsNight = isNight;

  function checkNight() {
    var night = isNight();
    if (night && !nightOn) {
      nightOn = true;
      nightEl.style.display = "block";
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    } else if (!night && nightOn) {
      nightOn = false;
      nightEl.style.display = "none";
      if (deck.length) {
        start();
      }
    }
  }

  function clipped(node) {
    if (!node) {
      return false;
    }
    var style = window.getComputedStyle(node);
    var lineHeight = parseFloat(style.lineHeight);
    if (!lineHeight) {
      lineHeight = parseFloat(style.fontSize) * 1.2;
    }
    // the box is allowed a little spill for descenders, but not a whole hidden line
    return node.scrollHeight - node.clientHeight > lineHeight * 0.6;
  }

  function fitLayer(layer) {
    var slide = layer.slide;
    var scale = SCALE_MAX;
    var guard = 0;
    slide.style.setProperty("--s", scale);

    var style = window.getComputedStyle(slide);
    var room = slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);

    while (
      scale > SCALE_MIN &&
      guard < 30 &&
      (layer.detail.getBoundingClientRect().height > room + 1 ||
        clipped(layer.title) ||
        clipped(layer.subtitle))
    ) {
      scale = Math.round((scale - 0.05) * 100) / 100;
      slide.style.setProperty("--s", scale);
      guard++;
    }
  }

  function makeLayer() {
    var slide = document.createElement("div");
    slide.className = "slide";

    var self = null;

    var cover = document.createElement("img");
    cover.className = "cover";
    cover.setAttribute("alt", "");
    cover.onerror = function () {
      cover.className = "cover hidden";
      detail.className = "detail wide";
      if (self) {
        fitLayer(self);
      }
    };
    cover.onload = function () {
      if (self) {
        fitLayer(self);
      }
    };

    var detail = document.createElement("div");
    detail.className = "detail";

    var title = document.createElement("h1");
    title.className = "title";

    var subtitle = document.createElement("p");
    subtitle.className = "subtitle";

    var author = document.createElement("p");
    author.className = "author";

    var series = document.createElement("p");
    series.className = "series";

    var rating = document.createElement("div");
    rating.className = "rating";

    var date = document.createElement("p");
    date.className = "date";

    detail.appendChild(title);
    detail.appendChild(subtitle);
    detail.appendChild(series);
    detail.appendChild(author);

    var pages = document.createElement("p");
    pages.className = "pages";
    detail.appendChild(pages);

    detail.appendChild(rating);
    detail.appendChild(date);

    slide.appendChild(cover);
    slide.appendChild(detail);
    stage.appendChild(slide);

    self = {
      slide: slide,
      cover: cover,
      detail: detail,
      title: title,
      subtitle: subtitle,
      author: author,
      series: series,
      rating: rating,
      date: date,
      pages: pages
    };
    return self;
  }

  var starCounter = 0;

  // Draws five stars. A rating like 3.25 fills three stars and a quarter of
  // the fourth, using a hard-edged gradient inside that one star.
  function starsFor(rating) {
    var value = parseFloat(rating) || 0;
    var markup = "";
    var i, share, fill, defs, percent;
    for (i = 1; i <= 5; i++) {
      share = Math.max(0, Math.min(1, value - (i - 1)));
      defs = "";
      if (share >= 0.99) {
        fill = "#262320";
      } else if (share <= 0.01) {
        fill = "#d7d2c8";
      } else {
        starCounter++;
        percent = Math.round(share * 100);
        defs =
          '<defs><linearGradient id="partial-star-' + starCounter +
          '" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="' + percent + '%" stop-color="#262320"/>' +
          '<stop offset="' + percent + '%" stop-color="#d7d2c8"/>' +
          "</linearGradient></defs>";
        fill = "url(#partial-star-" + starCounter + ")";
      }
      markup +=
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        defs +
        '<path d="' + STAR_PATH + '" fill="' + fill + '"/></svg>';
    }
    return markup;
  }

  function render(layer, book) {
    layer.title.textContent = book.title || "";
    layer.subtitle.textContent = book.subtitle || "";
    layer.subtitle.style.display = book.subtitle ? "" : "none";
    layer.author.textContent = book.author || "";
    layer.author.style.display = book.author ? "" : "none";
    layer.series.textContent = book.series || "";
    layer.series.style.display = book.series ? "" : "none";
    layer.date.textContent = book.date || "";
    layer.date.style.display = book.date ? "" : "none";
    layer.pages.textContent = book.pages || "";
    layer.pages.style.display = book.pages ? "" : "none";

    if (book.rating > 0) {
      layer.rating.className = "rating";
      layer.rating.innerHTML = starsFor(book.rating);
    } else {
      layer.rating.className = "rating empty";
      layer.rating.innerHTML = "";
    }

    if (book.cover) {
      layer.cover.className = "cover";
      layer.cover.src = book.cover;
      layer.detail.className = "detail";
    } else {
      layer.cover.className = "cover hidden";
      layer.cover.removeAttribute("src");
      layer.detail.className = "detail wide";
    }

    fitLayer(layer);
  }

  function saveProgress() {
    try {
      var order = [];
      var i;
      for (i = 0; i < deck.length; i++) {
        order.push(deck[i].id);
      }
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({ order: order, index: current })
      );
    } catch (error) {
      // Storage unavailable. The deck still works, it just won't resume.
    }
  }

  function readProgress() {
    try {
      var stored = window.localStorage.getItem(STORAGE_KEY);
      if (stored) {
        var parsed = JSON.parse(stored);
        if (parsed && parsed.order && parsed.order.length) {
          return parsed;
        }
      }
    } catch (error) {
      // Unreadable. Start fresh.
    }
    return null;
  }

  function buildDeck() {
    var byId = {};
    var i;
    for (i = 0; i < books.length; i++) {
      byId[books[i].id] = books[i];
    }

    var saved = readProgress();
    if (!saved) {
      deck = shuffle(books);
      current = 0;
      saveProgress();
      return;
    }

    // Keep the saved order, dropping anything no longer on the shelves.
    var order = [];
    var seen = {};
    for (i = 0; i < saved.order.length; i++) {
      var id = saved.order[i];
      if (byId[id] && !seen[id]) {
        seen[id] = true;
        order.push(byId[id]);
      }
    }

    var position = saved.index;
    if (position > order.length) {
      position = order.length;
    }

    // Books added since last time drop into the part of the deck that hasn't
    // played yet, so a new book doesn't have to wait out a whole cycle.
    for (i = 0; i < books.length; i++) {
      if (!seen[books[i].id]) {
        var slot =
          position + Math.floor(Math.random() * (order.length - position + 1));
        order.splice(slot, 0, books[i]);
      }
    }

    if (order.length) {
      deck = order;
      current = position;
    } else {
      deck = shuffle(books);
      current = 0;
    }
    saveProgress();
  }

  function shuffle(list) {
    var copy = list.slice();
    var i, j, swap;
    for (i = copy.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      swap = copy[i];
      copy[i] = copy[j];
      copy[j] = swap;
    }
    return copy;
  }

  function preload(book) {
    if (book && book.cover) {
      var ghost = new Image();
      ghost.src = book.cover;
    }
  }

  function advance() {
    if (!deck.length || nightOn) {
      return;
    }

    if (current >= deck.length) {
      deck = shuffle(books);
      current = 0;
    }

    var book = deck[current];
    var incoming = layers[0];
    var outgoing = layers[1];

    render(incoming, book);
    incoming.slide.className = "slide showing";
    if (outgoing) {
      outgoing.slide.className = "slide";
    }

    layers.reverse();
    current++;
    saveProgress();
    preload(deck[current]);

    notice.className = "notice gone";
  }

  function checkDimming() {
    var hour = new Date().getHours();
    var dim = hour >= DIM_START_HOUR || hour < DIM_END_HOUR;
    document.body.className = dim ? "dimmed" : "";
  }

  function start() {
    checkNight();
    if (nightOn) {
      return;
    }
    if (timer) {
      window.clearInterval(timer);
    }
    advance();
    timer = window.setInterval(advance, SLIDE_MS);
  }

  function load(isFirstRun) {
    var request = new XMLHttpRequest();
    var url = DATA_URL + "?v=" + new Date().getTime();

    request.open("GET", url, true);

    request.onreadystatechange = function () {
      if (request.readyState !== 4) {
        return;
      }

      var payload = null;
      if (request.status >= 200 && request.status < 300) {
        try {
          payload = JSON.parse(request.responseText);
        } catch (error) {
          payload = null;
        }
      }

      if (payload && payload.books && payload.books.length) {
        books = payload.books;
        if (isFirstRun) {
          buildDeck();
          start();
        }
      } else if (isFirstRun) {
        notice.className = "notice";
        notice.textContent =
          "No shelf data yet. Check that books.json is published alongside this page.";
      }
    };

    request.onerror = function () {
      if (isFirstRun) {
        notice.className = "notice";
        notice.textContent = "Could not load the shelf. Check the network connection.";
      }
    };

    request.send();
  }

  layers.push(makeLayer());
  layers.push(makeLayer());

  checkDimming();
  window.setInterval(checkDimming, 5 * 60 * 1000);

  checkNight();
  window.setInterval(checkNight, 15 * 1000);

  function refitAll() {
    var i;
    for (i = 0; i < layers.length; i++) {
      fitLayer(layers[i]);
    }
  }
  window.addEventListener("resize", refitAll, false);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(refitAll);
  }

  load(true);
  window.setInterval(function () {
    load(false);
  }, REFETCH_MS);

  // Swipe right to go back to the previous book. Tapping still moves forward.
  var touchStartX = 0;
  var touchStartY = 0;
  var touchStartTime = 0;
  var lastSwipe = 0;

  function goBack() {
    if (!deck.length || nightOn) {
      return;
    }
    // current points at the next book, so the one on screen is current - 1
    // and the one before it is current - 2. From the first book, wrap to the last.
    var target = current - 2;
    if (target < 0) {
      target = deck.length - 1;
    }
    current = target;
    start();
  }

  document.addEventListener("touchstart", function (event) {
    var touch = event.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = new Date().getTime();
  }, false);

  document.addEventListener("touchend", function (event) {
    var touch = event.changedTouches[0];
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    var elapsed = new Date().getTime() - touchStartTime;
    if (elapsed < 900 && dx > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lastSwipe = new Date().getTime();
      goBack();
    }
  }, false);

  document.addEventListener("click", function () {
    if (new Date().getTime() - lastSwipe < 600) {
      return;
    }
    start();
  }, false);
})();
</script>

<script src="flight-alert.js"></script>
</body>
</html>
